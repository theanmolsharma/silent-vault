# Foundation application configuration
app-name = "sp-receive-card"
friendly-app-name = "SP Receive Card"
launcher-app-name = "SP Receive"
description = "BIP352 Silent Payments receive card"
icon = "resources/icon.svg"
theme = "resources/theme.json"
app-id = "0xd85facd9db4be318a872f5dde54c0290"
min-keyos-version = "1.0.0"

[publisher]
name = ""
contact-email = ""
support-url = ""

# gui-app: drawing, keyboard, and ShowModal (used for the system PIN prompt).
# fs-generic: read/write this app's private AppData directory.
# GetAppSeed: the app-scoped seed the receiving keys are derived from (asked on first use).
[permissions]
template = ["gui-app", "fs-generic"]
"os/security" = ["GetAppSeed"]
